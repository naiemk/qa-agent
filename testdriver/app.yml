# Private GitHub App manifest (days 0–2 dogfood).
# Register via Probot manifest flow or paste these into GitHub → New GitHub App.
# Day 7–10: flip visibility to public; share installations/new URL.
#
# Suggested name / slug: magpi-test
# Install URL once public: https://github.com/apps/magpi-test/installations/new

name: magpi-test
description: >-
  Mention @magpi-test on an issue or PR with a preview URL; Magpi Test runs
  attach-mode QA and posts a summary on the thread.
url: https://github.com/naiemk/qa-agent
public: false

default_events:
  - issue_comment
  - pull_request

default_permissions:
  # Comment on issues and PRs; read bodies for the trigger phrase
  issues: write
  pull_requests: write
  # Post check runs when enabled later
  checks: write
  # Commit status updates when enabled later
  statuses: write
  # Read repository contents only (no write in phase 1)
  contents: read
  metadata: read
